name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src tests scripts app
      - run: ruff format --check src tests scripts app

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            torch torchvision
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run test suite
        env:
          # timm must not try to download pretrained weights in CI
          HF_HUB_OFFLINE: "1"
        run: pytest --cov=src/rdc --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  pipeline:
    name: End-to-end pipeline smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r requirements.txt
          pip install -e .
      - name: Train a demo model and serve it
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          python scripts/train_demo_model.py --epochs 1 --per-country 40
          test -f models/binary/model.pt
          uvicorn rdc.api.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && break || sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health | grep '"model_loaded":true'

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build inference image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: rdc-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
