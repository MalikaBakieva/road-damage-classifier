services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: rdc-api:1.0.0
    container_name: rdc-api
    ports:
      - "8000:8000"
    environment:
      RDC_MODEL_PATH: /app/models/binary/model.pt
      RDC_CONFIDENCE_THRESHOLD: "0.6"
      RDC_MAX_UPLOAD_MB: "10"
      RDC_DEVICE: cpu
    volumes:
      # Mount locally trained weights without rebuilding the image.
      - ./models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    image: rdc-ui:1.0.0
    container_name: rdc-ui
    ports:
      - "8501:8501"
    environment:
      RDC_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    container_name: rdc-mlflow
    profiles: ["tracking"]     # docker compose --profile tracking up
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri file:/mlruns
      --default-artifact-root file:/mlruns
